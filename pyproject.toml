[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kq-quant-tool"
version = "0.1.0"
description = "Korean market regime, robo-signal, screener, and portfolio validation tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.66",
    "curl_cffi>=0.7.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
    "lightgbm>=4.0.0",
    "hmmlearn>=0.3.0; python_version < '3.14'",
]

[project.scripts]
kq-tool = "kq_tool.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
